<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Connected digital systems</title>
  <desc id="desc">An abstract composition of connected software, data and service modules.</desc>
  <defs>
    <linearGradient id="glass" x1="250" y1="150" x2="900" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CC7FF" stop-opacity=".64"/>
      <stop offset=".52" stop-color="#1F4FD8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#0B1F3A" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="edge" x1="330" y1="170" x2="900" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D7E9FF" stop-opacity=".9"/>
      <stop offset=".52" stop-color="#55A7FF" stop-opacity=".72"/>
      <stop offset="1" stop-color="#C6F432" stop-opacity=".76"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F6F7FA" stop-opacity=".94"/>
      <stop offset="1" stop-color="#A9C9F6" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="faceBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4289FF"/>
      <stop offset="1" stop-color="#123F9F"/>
    </linearGradient>
    <linearGradient id="faceLight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DCEAFF"/>
      <stop offset="1" stop-color="#6E9DE3"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="matrix(0 345 -470 0 600 456)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F4FD8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#1F4FD8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="24"/>
      <feColorMatrix values="0 0 0 0 0.01 0 0 0 0 0.04 0 0 0 0 0.12 0 0 0 .45 0"/>
      <feBlend in2="SourceGraphic" mode="normal"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="615" cy="455" rx="480" ry="370" fill="url(#halo)"/>
  <ellipse cx="610" cy="533" rx="440" ry="272" stroke="#86B8F8" stroke-opacity=".24" stroke-width="2" transform="rotate(-17 610 533)"/>
  <ellipse cx="610" cy="533" rx="350" ry="353" stroke="#C6F432" stroke-opacity=".18" stroke-width="2" transform="rotate(31 610 533)"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M203 438C334 321 403 286 528 302M675 282C828 275 897 322 1007 424M241 605C382 614 440 638 535 604M684 620C824 638 891 596 1010 526" stroke="#60A9FF" stroke-opacity=".7" stroke-width="4"/>
    <path d="M206 438C334 321 403 286 528 302M675 282C828 275 897 322 1007 424M241 605C382 614 440 638 535 604M684 620C824 638 891 596 1010 526" stroke="#1F4FD8" stroke-opacity=".58" stroke-width="16" filter="url(#glow)"/>
    <path d="M320 315L356 291M853 303l34 21M303 610l32 3M853 614l40-13" stroke="#C6F432" stroke-width="5"/>
  </g>

  <g filter="url(#shadow)">
