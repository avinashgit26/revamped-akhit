  <g fill="#C7DFFF" fill-opacity=".72">
    <circle cx="300" cy="207" r="4"/><circle cx="765" cy="183" r="3"/><circle cx="1092" cy="359" r="4"/>
    <circle cx="169" cy="532" r="3"/><circle cx="743" cy="751" r="4"/><circle cx="442" cy="741" r="3"/>
