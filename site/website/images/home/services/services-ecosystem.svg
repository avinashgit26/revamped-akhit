    <path d="m886 332 29-31 26 17 42-54 34 14" stroke="#C6F432" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(8 853 242)"/>
    <circle cx="913" cy="301" r="8" fill="#F6F7FA" transform="rotate(8 853 242)"/>
    <circle cx="941" cy="318" r="8" fill="#F6F7FA" transform="rotate(8 853 242)"/>
    <circle cx="983" cy="264" r="8" fill="#F6F7FA" transform="rotate(8 853 242)"/>
    <rect x="858" y="571" width="201" height="138" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="3" transform="rotate(-8 858 571)"/>
    <circle cx="910" cy="633" r="28" stroke="#C6F432" stroke-width="9" transform="rotate(-8 858 571)"/>
    <path d="M957 619h67m-67 27h47m-47 27h58" stroke="#F6F7FA" stroke-opacity=".9" stroke-width="8" stroke-linecap="round" transform="rotate(-8 858 571)"/>
    <rect x="227" y="583" width="157" height="112" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="3" transform="rotate(7 227 583)"/>
    <path d="M258 659h22v-36h23v36h23v-55h24v55" stroke="#F6F7FA" stroke-opacity=".92" stroke-width="9" stroke-linejoin="round" transform="rotate(7 227 583)"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="356" cy="291" r="12" fill="#C6F432"/>
    <circle cx="887" cy="324" r="11" fill="#C6F432"/>
    <circle cx="335" cy="613" r="10" fill="#C6F432"/>
    <circle cx="893" cy="601" r="12" fill="#C6F432"/>
    <circle cx="605" cy="384" r="10" fill="#F6F7FA"/>
