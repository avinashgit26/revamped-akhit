    <path d="m418 491 187 116v133L418 622V491Z" fill="#102E60" stroke="#76B2FF" stroke-opacity=".65" stroke-width="3"/>
    <path d="m605 607 190-114v129L605 740V607Z" fill="#0B2550" stroke="#76B2FF" stroke-opacity=".62" stroke-width="3"/>
    <path d="m470 492 133-77 138 79-136 81-135-83Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="3"/>
    <path d="m528 458 77-45 80 46-78 47-79-48Z" fill="#C6F432" fill-opacity=".9" stroke="#F0FFD0" stroke-width="2"/>
    <path d="m528 458 79 48v53l-79-49v-52Z" fill="#6E9A18"/>
    <path d="m607 506 78-47v52l-78 48v-53Z" fill="#91BD22"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="124" y="337" width="200" height="134" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="3" transform="rotate(-9 124 337)"/>
    <rect x="151" y="360" width="52" height="52" rx="12" fill="#C6F432" fill-opacity=".9" transform="rotate(-9 151 360)"/>
    <path d="m219 383 64-10m-61 34 44-7" stroke="#F6F7FA" stroke-opacity=".92" stroke-width="9" stroke-linecap="round"/>
